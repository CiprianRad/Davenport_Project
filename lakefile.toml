name = "Davenport_Project"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DavenportProject"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "d6b19107529f14ba04640221cf560d767c81c8e9"

[[lean_lib]]
name = "DavenportProject"

# The computation of Lemma 5.3, checked by the kernel. Mathlib-free, so that
# its many kernel checks run with a small environment.
[[lean_lib]]
name = "DavenportCompute"
